<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple, full-screen poster gallery with swipe and arrow navigation."
    />
    <meta name="theme-color" content="#102838" />
    <title>The Poster Room</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="viewer" aria-label="Poster gallery">
      <header class="viewer-header">
        <a class="brand" href="./" aria-label="The Poster Room, reload with a random poster">
          <span class="brand-mark" aria-hidden="true">P</span>
          <span>
            <strong>The Poster Room</strong>
            <small>Swipe to explore</small>
          </span>
        </a>

        <p class="random-note">
          <span aria-hidden="true"></span>
          Random start
        </p>
      </header>

      <section
        class="poster-stage"
        id="poster-stage"
        tabindex="0"
        aria-roledescription="carousel"
        aria-label="Posters. Use the left and right arrow keys to browse."
      >
        <button class="nav-button previous" type="button" aria-label="Show previous poster">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>

        <figure class="poster-frame" aria-live="polite">
          <div class="poster-canvas">
            <img id="poster-image" alt="" draggable="false" />
            <div class="loading-state" id="loading-state">Loading posters…</div>
          </div>
          <figcaption class="poster-caption">
            <span id="poster-title">Poster</span>
          </figcaption>
        </figure>

        <button class="nav-button next" type="button" aria-label="Show next poster">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </section>

      <footer class="viewer-footer">
        <span class="poster-counter" id="poster-counter" aria-live="polite">— / —</span>
        <div class="poster-dots" id="poster-dots" aria-label="Choose a poster"></div>
        <span class="gesture-hint"><span aria-hidden="true">↔</span> Swipe or drag</span>
      </footer>
    </main>
  </body>
</html>
