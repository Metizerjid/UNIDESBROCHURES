<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sürdürülebilirlik görsel galerisi."
    />
    <meta name="theme-color" content="#1f3d2b" />
    <title>Sürdürülebilirlik Galerisi</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=20261116-1" />
    <script src="script.js?v=20261115-4" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand-row">
          <a
            class="brand"
            id="brand-link"
            href="?afis=1"
            aria-label="Sürdürülebilirlik galerisi"
          >
            <span class="brand-logo-shell">
              <img
                class="brand-logo"
                src="assets/brand/kurum-logolari-kontrast.png"
                alt="Gençlik ve Spor Bakanlığı, UNIDES, IEEE ve İstanbul Medipol Üniversitesi logoları"
              />
            </span>
          </a>
          <span class="etiket">Sürdürülebilirlik</span>
        </div>

        <div class="hero-copy">
          <h1>Doğayı Koru, Geleceği Yeşert</h1>
          <p>Gezegenimizin geleceği için hazırlanan çalışmaları keşfet.</p>
        </div>
      </div>
    </header>

    <main class="gallery" aria-label="Sürdürülebilirlik görsel galerisi">
      <section
        class="slider"
        id="poster-stage"
        tabindex="0"
        aria-roledescription="carousel"
        aria-label="Görseller. Gezinmek için sol ve sağ ok tuşlarını kullanın."
      >
        <button class="nav-button previous" type="button" aria-label="Önceki görseli göster">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>

        <figure class="poster-frame" aria-live="polite">
          <div class="poster-canvas">
            <div class="poster-media">
              <img id="poster-image" alt="" draggable="false" />
            </div>
            <div class="loading-state" id="loading-state">Görseller yükleniyor…</div>
          </div>
        </figure>

        <button class="nav-button next" type="button" aria-label="Sonraki görseli göster">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </section>

      <nav class="noktalar" id="poster-dots" aria-label="Görsel seçimi"></nav>
      <p class="ipucu"><span aria-hidden="true">↔</span> Görseller arasında geçiş için kaydır, sürükle veya numaralara dokun.</p>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Daha yeşil bir dünya için</p>
    </footer>
  </body>
</html>
